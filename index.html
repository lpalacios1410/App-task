<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./css/edit.css">
    <link rel="stylesheet" href="./css/dark-mode.css">
    <title>App Task</title>
</head>
<body>
    <div class="container">
        <h1>App Task</h1>

        <button id="theme-toggle">Cambiar a Modo Oscuro</button>
        
        <div class="user-profile">
            <div id="fecha" class="fecha"></div>
            <h2>Hola, Luis Palacios!</h2>
            <p>Vamos a cumplir todas las tareas</p>
        </div>
        <div class="stats-container">
            <div id="progressBar">
                <div id="progress"></div>
            </div>
            <div class="stats-numbers">
                <p id="numbers">0/0</p>
            </div>
        </div>
        
        <form class="add-task">
            <input type="text" id="taskInput"  placeholder="Agrega una tarea">
            <button type="submit" id="newTask">+</button>
        </form>
        
        <div class="section-task">
            <h3>Estas son tus tareas <strong>Pendientes</strong></h3>
            <ul id="lista">
                <!-- Esto se rellenara dinamicamente con js -->
            </ul>
        </div>
        <div class="section-jobs">
            <div class ="section-completed">
                <h3>Estas son tus tareas <strong>Completadas</strong></h3>
                <ul id="taskNodeCompleted">
                    <!-- Esto se rellenara dinamicamente con js -->
                </ul>
            </div>
            <div class ="section-incompleted">
                <h3>Estas son tus tareas <strong>Incompletas</strong></h3>
                <ul id="taskNodeIncompleted">
                    <!-- Esto se rellenara dinamicamente con js -->
                </ul>
            </div>
        </div>

    <section class="modal">
        <div class="modal-content">
            <h2>Editar Tarea</h2>
            <label for="editTaskInput">Editar Tarea:</label>
            <input type="text" id="editTaskInput" placeholder="Edita tu tarea">
            <button id="saveChanges">Guardar Cambios</button>
            <button id="close-modal">Cerrar</button>
        </div>
    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/app.js" type="module"></script>
    <script src="./js/filters.js" type="module"></script>
    <script src="./js/ui.js" type="module"></script>
    <script src="https://kit.fontawesome.com/659da6503d.js" crossorigin="anonymous"></script>
</body>
</html>
